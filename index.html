<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Costa Cantábrica · plages & criques</title>
  <meta name="description" content="Sélecteur de plages et criques des Asturies et de Cantabrie, avec prévisions météo, houle et marées pour planifier vos sorties.">
  <meta name="theme-color" content="#0b6e99">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/style.css?v=202609131939">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark" id="brand-mark"></span><span class="brand-text"><b>Costa</b><small>Asturias · Cantabria</small></span></div>
    <div class="who" id="who" title="Qui marque ses envies ? (appui long : réglages)"></div>
    <button class="iconbtn" id="btn-settings" title="Voyageurs, partage, export"></button>
    <button class="iconbtn" id="btn-filters" title="Filtres & tri"></button>
  </header>

  <div id="map" role="application" aria-label="Carte des plages"></div>
  <div class="map-tools">
    <button class="iconbtn float" id="btn-locate" title="Ma position"></button>
    <button class="iconbtn float" id="btn-share" title="Partager la sélection"></button>
  </div>
  <div class="layer-chips" id="layer-chips"></div>
  <div class="legend" id="legend"></div>

  <aside id="sheet" class="sheet half">
    <div class="handle" id="handle" aria-label="Agrandir ou réduire le panneau"></div>
    <div class="panel" id="panels">
      <section id="panel-list">
        <div class="days" id="days" aria-label="Choix du jour"></div>
        <div class="seg profiles-seg" id="profile-seg" role="tablist" aria-label="Profil d'activité"></div>
        <label class="search"><span id="search-ic"></span><input id="q" type="search" placeholder="Rechercher une plage…" autocomplete="off"></label>
        <div class="summary" id="summary"></div>
        <ul class="list" id="list"><li class="loading">Chargement…</li></ul>
      </section>
      <section id="panel-detail" class="detail" hidden>
        <div id="detail-head"></div>
        <div id="detail-body"></div>
      </section>
    </div>
  </aside>

  <dialog id="dlg-filters" class="bottom">
    <form method="dialog" class="dlg" onsubmit="return false">
      <div class="dlg-head"><h2>Filtres &amp; tri</h2><button class="linkbtn" id="f-reset" type="button">Réinitialiser</button></div>
      <div class="field"><span class="lbl">Province</span><div class="seg" id="f-province"></div></div>
      <div class="field"><span class="lbl">Type</span><div class="seg" id="f-type"></div></div>
      <div class="field"><span class="lbl">Caractéristiques</span><div class="chips" id="f-chips"></div></div>
      <div class="field"><span class="lbl">Envies</span><div class="seg" id="f-wish"></div></div>
      <div class="field"><div class="lbl-row"><span class="lbl">Score minimum</span><b id="f-min-out"></b></div><input id="f-min" type="range" min="0" max="90" step="5" value="0"></div>
      <div class="field"><span class="lbl">Tri</span><div class="seg" id="f-sort"></div></div>
      <button class="btn primary big" id="f-apply" type="button">Appliquer</button>
    </form>
  </dialog>

  <dialog id="dlg-settings">
    <form method="dialog" class="dlg" onsubmit="return false">
      <div class="dlg-head"><h2>Voyageurs</h2><button class="iconbtn close" type="button" aria-label="Fermer"></button></div>
      <div class="user-row"><span class="dot a"></span><input type="text" id="u-a" maxlength="14" placeholder="Prénom 1"></div>
      <div class="user-row"><span class="dot b"></span><input type="text" id="u-b" maxlength="14" placeholder="Prénom 2"></div>
      <p class="hint">Chacun marque ses envies ; le lien de partage fusionne les deux listes sur l'autre téléphone.</p>
      <div class="row wrap">
        <button class="btn ghost" id="u-share" type="button">Partager le lien</button>
        <button class="btn ghost" id="u-export" type="button">Exporter (GeoJSON)</button>
        <button class="btn ghost" id="u-refresh" type="button">Rafraîchir les prévisions</button>
      </div>
      <button class="btn primary big" id="u-save" type="button">Enregistrer</button>
    </form>
  </dialog>

  <div id="toast" role="status"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="js/config.js?v=202609131939"></script>
  <script src="js/icons.js?v=202609131939"></script>
  <script src="js/forecast.js?v=202609131939"></script>
  <script src="js/app.js?v=202609131939"></script>
</body>
</html>
